<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Configuração Inicial</title>
    <link rel="stylesheet" href="{{ url_for(\'static\', filename=\'css/style.css\') }}">
</head>
<body>
    <div class="container">
        <h1>Configuração Inicial</h1>
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                <div class="flash-messages">
                    {% for category, message in messages %}
                        <div class="alert alert-{{ category }}">{{ message }}</div>
                    {% endfor %}
                </div>
            {% endif %}
        {% endwith %}
        <form method="POST">
            <div class="form-group">
                <label for="secret_key">Chave Secreta:</label>
                <input type="text" id="secret_key" name="secret_key" class="form-control" required>
                <button type="button" onclick="generateSecretKey()">Gerar Chave</button>
            </div>
            <div class="form-group">
                <label for="database_url">URL do Banco de Dados:</label>
                <input type="text" id="database_url" name="database_url" class="form-control" value="sqlite:///site.db" required>
            </div>
            <button type="submit" class="btn btn-primary">Salvar Configuração</button>
        </form>
    </div>

    <script>
        function generateSecretKey() {
            const chars = \'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789!@#$%^&*()_+-=[]{}|;:,.<>?\';
            let result = \'\';
            for (let i = 0; i < 32; i++) {
                result += chars.charAt(Math.floor(Math.random() * chars.length));
            }
            document.getElementById(\'secret_key\').value = result;
        }
    </script>
</body>
</html>
